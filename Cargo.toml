[package]
name = "fast-sigma-raw"
version = "0.3.0"
edition = "2024"
license = "MIT AND BSD-3-Clause AND Apache-2.0"
description = "Fast SIGMA/Foveon X3F to linear DNG converter"
rust-version = "1.95"
repository = "https://github.com/wjhrdy/fast-sigma-raw"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
