name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: brew install pkg-config libtiff
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - name: Read package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build self-contained binaries
        run: |
          cargo test --all-targets --locked
          cargo build --release --locked --bins
        env:
          LIBTIFF_STATIC: "1"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
      - name: Reject Homebrew runtime dependencies
        run: |
          ! otool -L target/release/fast-sigma-raw | grep -E '/(opt/homebrew|usr/local)/'
          ! otool -L target/release/fast-sigma-raw-gui | grep -E '/(opt/homebrew|usr/local)/'
      - name: Package app
        run: packaging/macos/package.sh "$PACKAGE_VERSION" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libtiff-dev libwebp-dev libzstd-dev liblzma-dev libjbig-dev libjpeg-dev libdeflate-dev zlib1g-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
      - name: Read package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build self-contained binaries
        run: |
          cargo test --all-targets --locked
          cargo build --release --locked --bins
        env:
          LIBTIFF_STATIC: "1"
      - name: Reject a libtiff runtime dependency
        run: |
          ! ldd target/release/fast-sigma-raw | grep -i libtiff
          ! ldd target/release/fast-sigma-raw-gui | grep -i libtiff
      - name: Package application
        run: packaging/linux/package.sh "$PACKAGE_VERSION" x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
